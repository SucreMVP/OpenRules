[custom]
;不要随意改变关键字，否则会导致出错
;acl4SSR规则

;去广告：支持
;自动测速：支持
;微软分流：支持
;苹果分流：支持
;增强中国IP段：支持
;增强国外GFW：支持

; ==========================================================================
; 更新记录 2026-11-17
; 1. 已逐条校验下方全部 ruleset 链接：全部 HTTP 200 可访问，无 404 / 无失效。
; 2. 新增 https://github.com/jinxinkai/clash-ai-rules 中全部 AI 服务规则
;    （Anthropic / OpenAI / Gemini / xAI / Cursor / Windsurf / Trae /
;      AugmentCode / Muse / AppleIntelligence / Meta），全部并入 「💬 Ai平台」 策略组。
;    这些是 Clash classical rule-provider（payload: 列表），必须加 clash-classic: 前缀，
;    否则 subconverter 会按 Surge 格式解析而丢弃全部规则。
; 3. 「💬 Ai平台」可选节点：🚀 节点选择 / ♻️ 自动选择 / 🇺🇲 美国节点 / 🇯🇵 日本节点 /
;    🇨🇦 加拿大节点 / 🚀 手动切换 / DIRECT（保持原有顺序）。
; 4. 谷歌服务合并：原「📢 谷歌FCM」「📢 谷歌🇨🇳Play下载」「📢 谷歌🇨🇳Play服务」「📢 谷歌🇨🇳」
;    四组并入「📢 谷歌」，规则一条未删（仅组名统一）。「📹 油管视频」保持独立并前置，
;    因为 Google.list 内含 youtube.com / youtu.be / ytimg.com 等域名，否则会被谷歌组吞掉。
;    代价：原「谷歌🇨🇳」的国内直连资源（dl.google.com / gstatic / pki.goog / Play 更新）
;    默认改走代理；若想让它们直连，把「📢 谷歌」组切到 DIRECT 即可（但 google.com 也会跟着直连）。
; 提示：AI 规则集中含 PROCESS-NAME / DOMAIN-REGEX / IP-ASN 规则，
;       建议使用 Mihomo(Clash.Meta) 内核；原版 Clash Premium 不支持这些类型。
; ==========================================================================

